    <path d="M664 188h472m-472 50h472m-472 50h472m-472 50h472" stroke="#435166"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="59" letter-spacing="-1.5">
    <text x="62" y="85" fill="#202c3b">Perceived<tspan x="62" dy="61">understanding</tspan></text>
    <text x="662" y="85" fill="#faf5ea">Demonstrated<tspan x="662" dy="61">reasoning</tspan></text>
  </g>
