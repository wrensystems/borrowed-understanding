<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 366" width="1200" height="366" role="img" aria-labelledby="title description">
  <title id="title">Perceived understanding and demonstrated reasoning</title>
  <desc id="description">On an ivory field, a sweeping line represents perceived understanding. On a navy field, a path with branching evidence nodes represents demonstrated reasoning. The paths are conceptual and show no measurements.</desc>
